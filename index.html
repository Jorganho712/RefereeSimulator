<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Football Referee Simulator</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600;700&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<!-- Firebase (login com conta real). Veja instruções de configuração no <script> principal, na constante FIREBASE_CONFIG. -->
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.13.0/firebase-firestore-compat.js"></script>
<style>
:root{
  --pitch-dark:#0a2b20;
  --pitch:#0f4a34;
  --pitch-stripe:#12583d;
  --charcoal:#12181a;
  --charcoal-2:#1a2224;
  --panel:#182220;
  --gold:#d4af37;
  --gold-dim:#8a7326;
  --yellow:#f5c518;
  --red:#d7263d;
  --green-ok:#3ea86e;
  --cream:#f3efe3;
  --cream-dim:#c9c3ae;
  --ink:#0a0a0a;
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;height:100%;}
body{
  font-family:'Barlow',sans-serif;
  background:
    repeating-linear-gradient(90deg, var(--pitch) 0 80px, var(--pitch-stripe) 80px 160px),
    var(--pitch-dark);
  color:var(--cream);
  min-height:100vh;
  overflow-x:hidden;
}
#app{
  min-height:100vh;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:24px 16px 60px;
}
h1,h2,h3{font-family:'Anton',sans-serif; letter-spacing:0.5px; margin:0; text-transform:uppercase;}
.eyebrow{
  font-family:'Barlow Condensed',sans-serif;
  text-transform:uppercase;
  letter-spacing:3px;
  font-size:12px;
  color:var(--gold);
  font-weight:600;
}
.mono{font-family:'Space Mono',monospace;}
.shell{
  width:100%;
  max-width:920px;
  background:linear-gradient(180deg, rgba(18,24,26,0.96), rgba(10,14,15,0.98));
  border:1px solid rgba(212,175,55,0.25);
  border-radius:18px;
  box-shadow:0 30px 80px rgba(0,0,0,0.55), inset 0 1px 0 rgba(255,255,255,0.03);
  padding:28px 28px 32px;
  position:relative;
  overflow:hidden;
}
.shell::before{
  content:"";
  position:absolute; top:-2px; left:0; right:0; height:4px;
  background:linear-gradient(90deg, var(--gold), var(--yellow), var(--gold));
}
.topbar{
  display:flex; align-items:center; justify-content:space-between;
  margin-bottom:22px; flex-wrap:wrap; gap:10px;
}
.brand{display:flex; align-items:center; gap:12px;}
.brand .whistle{
  width:38px;height:38px;border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #333 0%, #0c0c0c 70%);
  border:2px solid var(--gold);
  display:flex;align-items:center;justify-content:center;
  font-size:18px;
}
.brand h1{font-size:26px; color:var(--cream); line-height:1;}
.brand span{font-size:11px;color:var(--gold-dim);font-family:'Barlow Condensed';letter-spacing:2px;}
.hud{
  display:flex; gap:14px; flex-wrap:wrap;
}
.hud-chip{
  background:var(--charcoal-2);
  border:1px solid rgba(212,175,55,0.2);
  border-radius:10px;
  padding:6px 12px;
  font-family:'Barlow Condensed';
  font-size:13px;
  display:flex; gap:6px; align-items:center;
  color:var(--cream-dim);
}
.hud-chip b{color:var(--gold); font-family:'Space Mono'; font-size:13px;}

.btn{
  font-family:'Barlow Condensed',sans-serif;
  font-weight:600; letter-spacing:1px; text-transform:uppercase;
  border:none; border-radius:10px; padding:13px 18px;
  cursor:pointer; font-size:15px;
  transition:transform .12s ease, box-shadow .12s ease, filter .12s ease;
  color:var(--ink);
  background:linear-gradient(180deg, var(--gold), var(--gold-dim));
  box-shadow:0 6px 0 rgba(0,0,0,0.35);
}
.btn:hover{filter:brightness(1.08); transform:translateY(-1px);}
.btn:active{transform:translateY(2px); box-shadow:0 3px 0 rgba(0,0,0,0.35);}
.btn.secondary{background:var(--charcoal-2); color:var(--cream); border:1px solid rgba(243,239,227,0.25); box-shadow:0 6px 0 rgba(0,0,0,0.25);}
.btn.danger{background:linear-gradient(180deg, var(--red), #8f1626); color:var(--cream);}
.btn.yellowcard{background:linear-gradient(180deg, var(--yellow), #b8940a); color:var(--ink);}
.btn.ghost{background:transparent;color:var(--cream-dim);border:1px dashed rgba(243,239,227,0.25); box-shadow:none;}
.btn:disabled{opacity:0.4; cursor:not-allowed; transform:none; box-shadow:none;}
.btn-row{display:flex; gap:10px; flex-wrap:wrap;}
.full{width:100%;}

.menu-grid{
  display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:14px; margin-top:6px;
}
.menu-card{
  background:linear-gradient(160deg, var(--panel), var(--charcoal));
  border:1px solid rgba(212,175,55,0.18);
  border-radius:14px; padding:18px; cursor:pointer;
  transition:transform .15s ease, border-color .15s ease;
  position:relative; overflow:hidden;
}
.menu-card:hover{transform:translateY(-3px); border-color:var(--gold);}
.menu-card .icon{font-size:28px; margin-bottom:8px; display:block;}
.menu-card h3{font-size:19px; color:var(--cream); margin-bottom:4px;}
.menu-card p{font-size:13px; color:var(--cream-dim); margin:0; line-height:1.4;}
.menu-card .tag{
  position:absolute; top:12px; right:12px; font-family:'Barlow Condensed';
  font-size:10px; letter-spacing:1.5px; text-transform:uppercase;
  background:rgba(212,175,55,0.15); color:var(--gold); padding:3px 8px; border-radius:20px;
}

.form-grid{display:grid; grid-template-columns:1fr 1fr; gap:14px;}
@media (max-width:640px){.form-grid{grid-template-columns:1fr;}}
label{display:block; font-family:'Barlow Condensed'; font-size:12px; letter-spacing:1.5px; text-transform:uppercase; color:var(--gold-dim); margin-bottom:5px;}
input[type=text], input[type=number], select{
  width:100%; padding:10px 12px; border-radius:8px; border:1px solid rgba(243,239,227,0.18);
  background:var(--charcoal-2); color:var(--cream); font-family:'Barlow'; font-size:14px;
}
input[type=range]{width:100%;}
.field{margin-bottom:14px;}
.swatches{display:flex; gap:8px; flex-wrap:wrap;}
.swatch{
  width:32px;height:32px;border-radius:50%; cursor:pointer; border:2px solid transparent;
}
.swatch.active{border-color:var(--gold); transform:scale(1.12);}
.choice-row{display:flex; gap:8px; flex-wrap:wrap;}
.choice-pill{
  padding:8px 14px; border-radius:20px; border:1px solid rgba(243,239,227,0.2);
  background:var(--charcoal-2); cursor:pointer; font-family:'Barlow Condensed'; font-size:13px;
  letter-spacing:1px; text-transform:uppercase; color:var(--cream-dim);
}
.choice-pill.active{background:var(--gold); color:var(--ink); border-color:var(--gold); font-weight:700;}

.avatar-preview{
  width:120px;height:120px;border-radius:50%; margin:0 auto 14px;
  display:flex;align-items:center;justify-content:center; font-size:52px;
  border:3px solid var(--gold); position:relative;
}
.avatar-wrap{text-align:center;}

.pitch-box{
  position:relative; width:100%; height:200px; border-radius:14px; overflow:hidden;
  background:repeating-linear-gradient(90deg, #14603f 0 40px, #176a46 40px 80px);
  border:2px solid rgba(212,175,55,0.35);
  margin-bottom:16px;
}
.pitch-box .center-line{position:absolute; left:50%; top:0; bottom:0; width:2px; background:rgba(255,255,255,0.35);}
.pitch-box .center-circle{position:absolute; left:50%; top:50%; width:70px; height:70px; margin:-35px 0 0 -35px; border:2px solid rgba(255,255,255,0.35); border-radius:50%;}
.pitch-box .box-left, .pitch-box .box-right{position:absolute; top:35%; bottom:35%; width:60px; border:2px solid rgba(255,255,255,0.35);}
.pitch-box .box-left{left:0; border-left:none;}
.pitch-box .box-right{right:0; border-right:none;}
.ball{
  position:absolute; width:16px; height:16px; border-radius:50%;
  background:radial-gradient(circle at 35% 30%, #fff, #ccc 60%, #999);
  box-shadow:0 2px 6px rgba(0,0,0,0.5);
  transition:left 1.1s ease, top 1.1s ease;
}

.scoreboard{
  display:flex; justify-content:space-between; align-items:center;
  background:var(--charcoal-2); border-radius:10px; padding:10px 16px; margin-bottom:14px;
  border:1px solid rgba(212,175,55,0.2);
}
.scoreboard .teams{font-family:'Barlow Condensed'; font-size:17px; font-weight:600; letter-spacing:0.5px;}
.scoreboard .clock{font-family:'Space Mono'; font-size:22px; color:var(--gold);}
.scoreboard-cards{display:flex; justify-content:space-between; font-family:'Barlow Condensed'; font-size:12px; color:var(--cream-dim); margin:-6px 0 14px; padding:0 4px;}
.scoreboard-cards span b{color:var(--cream);}
.zone-marker{
  position:absolute; width:22px; height:22px; margin:-11px 0 0 -11px; border-radius:50%;
  background:rgba(212,175,55,0.35); border:2px solid var(--gold);
  animation:zonepulse 1.4s ease-in-out infinite;
}
@keyframes zonepulse{0%{transform:scale(0.8); opacity:0.9;}70%{transform:scale(1.9); opacity:0;}100%{transform:scale(0.8); opacity:0;}}
.zone-tag{
  position:absolute; bottom:8px; left:8px; background:rgba(0,0,0,0.55); color:var(--gold);
  font-family:'Barlow Condensed'; font-size:11px; letter-spacing:1px; text-transform:uppercase;
  padding:4px 9px; border-radius:6px; border:1px solid rgba(212,175,55,0.35);
}
.event-head{display:flex; align-items:center; gap:8px; flex-wrap:wrap; margin-bottom:6px;}
.type-badge{
  display:inline-flex; align-items:center; gap:6px; font-family:'Barlow Condensed'; font-weight:700;
  font-size:12.5px; letter-spacing:1px; text-transform:uppercase; padding:5px 11px; border-radius:20px;
  background:rgba(255,255,255,0.06); border:1px solid currentColor;
}
.team-tag{
  display:inline-flex; align-items:center; gap:6px; font-family:'Barlow Condensed'; font-size:12.5px;
  letter-spacing:0.5px; padding:5px 10px; border-radius:20px; background:var(--charcoal-2); color:var(--cream);
  border:1px solid rgba(243,239,227,0.15);
}
.team-tag .dot{width:10px; height:10px; border-radius:50%; display:inline-block;}
.jersey-badge{
  font-family:'Space Mono'; font-size:12px; background:var(--charcoal-2); color:var(--gold);
  border:1px solid rgba(212,175,55,0.3); border-radius:6px; padding:3px 7px;
}
.minute-tag{font-family:'Space Mono'; font-size:12px; color:var(--cream-dim);}

.event-card{
  background:var(--panel); border:1px solid rgba(212,175,55,0.25); border-radius:14px;
  padding:18px; margin-bottom:14px;
}
.event-card .loc{font-family:'Barlow Condensed'; font-size:12px; letter-spacing:2px; text-transform:uppercase; color:var(--gold);}
.event-card .desc{font-size:16px; line-height:1.5; margin:8px 0 14px;}
.timer-ring-wrap{display:flex; align-items:center; gap:14px; margin-bottom:10px;}
.timer-ring{width:46px;height:46px;}
.timer-ring circle{fill:none; stroke-width:5;}
.timer-ring .bg{stroke:rgba(243,239,227,0.15);}
.timer-ring .fg{stroke:var(--gold); stroke-linecap:round; transform:rotate(-90deg); transform-origin:50% 50%; transition:stroke-dashoffset .2s linear, stroke .2s;}
.decision-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(150px,1fr)); gap:10px;}

.card-fly{
  position:fixed; top:40%; left:50%; transform:translate(-50%,-50%) scale(0) rotate(-8deg);
  width:80px; height:112px; border-radius:8px; z-index:999;
  box-shadow:0 20px 50px rgba(0,0,0,0.6);
  display:flex;align-items:center;justify-content:center; font-family:'Anton'; font-size:14px; color:#111;
  animation:cardslam .9s cubic-bezier(.2,1.4,.4,1) forwards;
}
@keyframes cardslam{
  0%{transform:translate(-50%,-50%) scale(0) rotate(-15deg); opacity:0;}
  55%{transform:translate(-50%,-50%) scale(1.15) rotate(-4deg); opacity:1;}
  75%{transform:translate(-50%,-50%) scale(1) rotate(-4deg); opacity:1;}
  100%{transform:translate(-50%,-160%) scale(0.85) rotate(-4deg); opacity:0;}
}

.var-overlay{
  position:fixed; inset:0; background:rgba(3,6,5,0.88); z-index:900;
  display:flex; align-items:center; justify-content:center; padding:20px;
}
.var-box{
  background:var(--charcoal); border:2px solid var(--gold); border-radius:16px; padding:26px;
  max-width:480px; width:100%; text-align:center;
}
.var-lines{font-family:'Anton'; letter-spacing:2px; color:var(--gold); font-size:20px; margin-bottom:10px;
  animation:blinkvar 1s infinite;}
@keyframes blinkvar{0%,100%{opacity:1;}50%{opacity:0.4;}}
.replay-box{background:var(--charcoal-2); border-radius:10px; padding:16px; margin:16px 0; font-size:14px; color:var(--cream-dim); text-align:left;}

.rating-bar-row{display:flex; align-items:center; gap:10px; margin-bottom:10px;}
.rating-bar-row .label{width:180px; font-family:'Barlow Condensed'; font-size:13px; letter-spacing:1px; text-transform:uppercase; color:var(--cream-dim);}
.rating-bar-track{flex:1; height:10px; border-radius:6px; background:rgba(243,239,227,0.1); overflow:hidden;}
.rating-bar-fill{height:100%; border-radius:6px; background:linear-gradient(90deg, var(--gold), var(--yellow));}
.rating-bar-row .val{width:36px; text-align:right; font-family:'Space Mono'; color:var(--gold); font-size:13px;}

.toast{
  position:fixed; bottom:20px; left:50%; transform:translateX(-50%);
  background:var(--charcoal); border:1px solid var(--gold); color:var(--cream);
  padding:10px 18px; border-radius:10px; font-family:'Barlow Condensed'; letter-spacing:1px;
  z-index:1000; opacity:0; transition:opacity .3s, transform .3s;
  font-size:14px;
}
.toast.show{opacity:1; transform:translateX(-50%) translateY(-4px);}

.stat-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(140px,1fr)); gap:12px; margin-top:10px;}
.stat-tile{background:var(--panel); border:1px solid rgba(212,175,55,0.2); border-radius:12px; padding:14px; text-align:center;}
.stat-tile .n{font-family:'Anton'; font-size:26px; color:var(--gold);}
.stat-tile .l{font-family:'Barlow Condensed'; font-size:11px; letter-spacing:1.5px; text-transform:uppercase; color:var(--cream-dim);}

.shop-grid{display:grid; grid-template-columns:repeat(auto-fit,minmax(160px,1fr)); gap:12px;}
.shop-item{background:var(--panel); border:1px solid rgba(212,175,55,0.2); border-radius:12px; padding:14px; text-align:center;}
.shop-item .ic{font-size:30px; margin-bottom:6px;}
.shop-item .price{font-family:'Space Mono'; color:var(--gold); margin:6px 0;}

.division-track{display:flex; flex-wrap:wrap; gap:6px; margin:14px 0;}
.division-pip{
  padding:6px 10px; border-radius:20px; font-family:'Barlow Condensed'; font-size:12px; letter-spacing:1px;
  text-transform:uppercase; background:var(--charcoal-2); color:var(--cream-dim); border:1px solid rgba(243,239,227,0.15);
}
.division-pip.current{background:var(--gold); color:var(--ink); font-weight:700;}
.division-pip.done{color:var(--green-ok); border-color:var(--green-ok);}

.section-title{margin:22px 0 10px; display:flex; align-items:center; gap:10px;}
.section-title .line{flex:1; height:1px; background:rgba(212,175,55,0.25);}

.notice{background:rgba(212,175,55,0.1); border:1px solid rgba(212,175,55,0.35); border-radius:10px; padding:10px 14px; font-size:13px; color:var(--cream-dim); margin-bottom:14px;}
small.hint{color:var(--cream-dim); font-size:12px;}
textarea{width:100%; min-height:60px; background:var(--charcoal-2); color:var(--cream); border:1px solid rgba(243,239,227,0.18); border-radius:8px; padding:10px; font-family:'Barlow'; margin-bottom:14px;}
</style>
</head>
<body>
<div id="app"></div>
<script>
/* =========================================================================
   FOOTBALL REFEREE SIMULATOR
   Prototipo completo em HTML/CSS/JS puro (single file)
   ========================================================================= */

/* ---------- Dados estaticos ---------- */
const DIVISIONS = [
  {key:'amador', name:'Amador', var:false, salary:150, promoAvg:6.4, minGames:2, crowd:1},
  {key:'estadual', name:'Estadual', var:false, salary:320, promoAvg:6.6, minGames:3, crowd:2},
  {key:'serieD', name:'Série D', var:false, salary:550, promoAvg:6.8, minGames:3, crowd:2},

  {key:'copaNacional', name:'Copa Nacional', var:true, salary:3800, promoAvg:7.6, minGames:3, crowd:5},
  {key:'libertadores', name:'Libertadores', var:true, salary:5200, promoAvg:7.8, minGames:4, crowd:6},
  {key:'champions', name:'Champions League', var:true, salary:7500, promoAvg:8.0, minGames:4, crowd:6},
  {key:'worldcup', name:'Copa do Mundo', var:true, salary:11000, promoAvg:null, minGames:0, crowd:7},
];

const CLUBS = ["Atlético Vale Verde","Porto Estrela FC","União Serra Azul","Real Cascavel","Náutico do Norte",
"Ferroviário Sul","Estrela do Rio","Grêmio Aurora","Vasco da Colina","Independente Litoral","Cruzeiro do Vale",
"Palmeira Dourada","Botafogo das Águas","Flamengo Rubro","Coritiba Serrano","Guarani Alvinegro","Sport Recife Novo",
"Bahia Praiano","Ceará Vermelho","América Mineiro"];

const PLAYER_NAMES = ["Rafa","Bino","Deco","Zeca","Tico","Vini","Léo","Cauê","Jotinha","Marlon","Yuri","Pipa",
"Digão","Nino","Tuca","Bruno","Kaká Jr.","Xandão","Rony","Gui"];

const COACH_NAMES = ["técnico Amauri","técnico Belchior","técnico Cazuza","técnico Duda","técnico Evandro"];

const PERSONALITIES = [
  {key:'rigoroso', label:'Mais rígido', desc:'Aplica a lei com mão de ferro. Cartões saem mais rápido.'},
  {key:'equilibrado', label:'Equilibrado', desc:'Deixa o jogo fluir, mas não abre mão da ordem.'},
  {key:'tolerante', label:'Mais tolerante', desc:'Prefere conversar antes de punir. Jogo mais solto.'},
];

const SKIN_TONES = ['#ffdbac','#f1c27d','#e0ac69','#c68642','#8d5524','#5a3825'];
const KIT_COLORS = ['#f5c518','#3ea86e','#3a6fd8','#d7263d','#181818','#e8e8e8'];
const EYE_COLORS = ['#3b2417','#2e5d3c','#3b6ea5','#555'];
const FACES = ['🙂','😐','🧔','👨‍🦱','👨‍🦳','👩','👩‍🦱','🧑'];

const SHOP_ITEMS = [
  {id:'kit_classic', cat:'Uniforme', name:'Kit Clássico Preto', price:0, icon:'🖤'},
  {id:'kit_gold', cat:'Uniforme', name:'Kit Dourado Elite', price:1200, icon:'🟡'},
  {id:'kit_neon', cat:'Uniforme', name:'Kit Neon Internacional', price:2200, icon:'💚'},
  {id:'whistle_classic', cat:'Apito', name:'Apito Clássico', price:0, icon:'🎼'},
  {id:'whistle_pro', cat:'Apito', name:'Apito Pro Titanium', price:800, icon:'🔔'},
  {id:'watch_basic', cat:'Relógio', name:'Relógio Básico', price:0, icon:'⌚'},
  {id:'watch_smart', cat:'Relógio', name:'Relógio Smart FIFA', price:1500, icon:'⏱️'},
  {id:'card_wallet_basic', cat:'Cartões', name:'Porta-cartões Padrão', price:0, icon:'🗂️'},
  {id:'card_wallet_gold', cat:'Cartões', name:'Porta-cartões Dourado', price:900, icon:'✨'},
  {id:'flag_basic', cat:'Acessório', name:'Bandeirinha Padrão', price:0, icon:'🚩'},
  {id:'earpiece_pro', cat:'Acessório', name:'Fone Comunicação Pro', price:1700, icon:'🎧'},
];

/* ---------- Estado global ---------- */
var state = {
  screen:'profileSelect',
  profile:null,
  profiles:[],
  authMode:null,
  firebaseUser:null,
  refExists:false,
  referee:null,
  career:null,
  customLeagues:[],
  matchCtx:null,
  editingLeague:null,
  toastTimeout:null,
};

const STORAGE_KEY_PROFILES = 'profilesList';
const STORAGE_KEY_CAREER = 'careerSave';
const STORAGE_KEY_LEAGUES = 'customLeagues';
function profileKey(base){ return base + '::' + state.profile; }

function defaultReferee(){
  return {
    firstName:'Marcos', lastName:'Andrade', nationality:'Brasil', age:32, height:180, weight:78,
    skin:SKIN_TONES[1], face:FACES[0], hair:'Curto', beard:'Sem barba', eye:EYE_COLORS[0],
    kit:KIT_COLORS[4], personality:'equilibrado', voice:'Firme', whistleStyle:'Curto e seco', runStyle:'Ágil',
  };
}

function defaultCareer(referee){
  return {
    referee,
    divisionIndex:0,
    money:200,
    gamesPlayed:0,
    ratingHistory:[],
    divisionRatings:[],

/* =========================================================================
   LOGIN COM CONTA REAL (Firebase) — CONFIGURAÇÃO
   =========================================================================
   Para ativar contas de verdade com login por e-mail e senha, sincronizadas
   na nuvem (funciona em qualquer navegador/dispositivo), siga estes passos:

   1. Acesse https://console.firebase.google.com e crie um projeto (gratuito).
   2. No menu lateral: Build > Authentication > Get Started >
      aba "Sign-in method" > ative "E-mail/senha".
   3. No menu lateral: Build > Firestore Database > Create Database >
      escolha "Start in production mode" e uma região próxima de você.
   4. Ainda no Firestore, vá em "Regras" (Rules) e cole isto, substituindo
      tudo que já estiver lá, depois clique em "Publicar":

        rules_version = '2';
        service cloud.firestore {
          match /databases/{database}/documents {
            match /players/{userId}/{document=**} {
              allow read, write: if request.auth != null && request.auth.uid == userId;
            }
          }
        }

   5. Clique no ícone de engrenagem (Configurações do projeto) > geral >
      role até "Seus apps" > clique no ícone "</>" (Web) > dê um apelido
      e registre o app > copie o objeto "firebaseConfig" que aparece.
   6. Cole os valores copiados nas aspas abaixo, substituindo os textos
      "COLE_AQUI...". Salve o arquivo — pronto, o login por conta real
      passa a aparecer automaticamente na tela inicial do jogo.

   Enquanto isso não for preenchido, o jogo continua funcionando
   normalmente com o "Perfil Local" (salvo apenas neste navegador).
   ========================================================================= */
const FIREBASE_CONFIG = {
  apiKey: "COLE_AQUI_SUA_API_KEY",
  authDomain: "COLE_AQUI.firebaseapp.com",
  projectId: "COLE_AQUI_SEU_PROJECT_ID",
  storageBucket: "COLE_AQUI.appspot.com",
  messagingSenderId: "COLE_AQUI_O_SENDER_ID",
  appId: "COLE_AQUI_O_APP_ID"
};

var cloudReady = false;
var cloudAuth = null;
var cloudDb = null;
try{
  if(FIREBASE_CONFIG.apiKey && !FIREBASE_CONFIG.apiKey.startsWith('COLE_AQUI') && typeof firebase !== 'undefined'){
    firebase.initializeApp(FIREBASE_CONFIG);
    cloudAuth = firebase.auth();
    cloudDb = firebase.firestore();
    cloudReady = true;
  }
}catch(e){ console.error('Falha ao iniciar Firebase:', e); cloudReady = false; }

function hasArtifactStorage(){
  return typeof window.storage !== 'undefined' && window.storage && typeof window.storage.get === 'function';
}
function isCloudSession(){
  return cloudReady && state.authMode==='cloud' && cloudAuth && cloudAuth.currentUser;
}
function cloudDocRef(key){
  const uid = cloudAuth.currentUser.uid;
  const safeKey = key.replace(/[\/\.]/g, '_');
  return cloudDb.collection('players').doc(uid).collection('saves').doc(safeKey);
}
async function storageRead(key){
  if(isCloudSession()){
    try{ const snap = await cloudDocRef(key).get(); return snap.exists ? snap.data().value : null; }
    catch(e){ console.error('Falha ao ler da nuvem:', e); return null; }
  }
  if(hasArtifactStorage()){
    try{ const r = await window.storage.get(key, false); return (r && r.value!=null) ? r.value : null; }
    catch(e){ return null; }
  }
  try{ return window.localStorage.getItem(key); }catch(e){ return null; }
}
async function storageWrite(key, value){
  if(isCloudSession()){
    try{ await cloudDocRef(key).set({value}); return true; }
    catch(e){ console.error('Falha ao salvar na nuvem:', e); return false; }
  }
  if(hasArtifactStorage()){
    try{ await window.storage.set(key, value, false); return true; }
    catch(e){ console.error('Falha ao salvar (artifact storage):', e); return false; }
  }
  try{ window.localStorage.setItem(key, value); return true; }
  catch(e){ console.error('Falha ao salvar (localStorage):', e); return false; }
}
async function storageDelete(key){
  if(isCloudSession()){
    try{ await cloudDocRef(key).delete(); return true; }catch(e){ return false; }
  }
  if(hasArtifactStorage()){
    try{ await window.storage.delete(key, false); return true; }catch(e){ return false; }
  }
  try{ window.localStorage.removeItem(key); return true; }catch(e){ return false; }
}


async function loadProfilesList(){
  try{
    const val = await storageRead(STORAGE_KEY_PROFILES);
    state.profiles = val ? JSON.parse(val) : [];
  }catch(e){ state.profiles = []; }
}
async function saveProfilesList(){
  const ok = await storageWrite(STORAGE_KEY_PROFILES, JSON.stringify(state.profiles));
  if(!ok) showToast('⚠️ Não foi possível salvar a lista de perfis neste navegador.');
}
async function migrateLegacySaveIfNeeded(){
  if(state.profiles.length>0) return;
  const legacyCareer = await storageRead(STORAGE_KEY_CAREER);
  if(!legacyCareer) return;
  const name = 'Jogador';
  state.profiles.push({name, pin:null, createdAt:Date.now()});
  await storageWrite(STORAGE_KEY_CAREER+'::'+name, legacyCareer);
  const legacyLeagues = await storageRead(STORAGE_KEY_LEAGUES);
  if(legacyLeagues) await storageWrite(STORAGE_KEY_LEAGUES+'::'+name, legacyLeagues);
  await saveProfilesList();
}

async function loadCareer(){
  try{
    const val = await storageRead(profileKey(STORAGE_KEY_CAREER));
    if(val){
      state.career = JSON.parse(val);
      state.referee = state.career.referee;
      state.refExists = true;
    }
  }catch(e){ /* nada salvo ainda */ }
  try{
    const val2 = await storageRead(profileKey(STORAGE_KEY_LEAGUES));
    if(val2){ state.customLeagues = JSON.parse(val2); }
  }catch(e){ /* nada salvo ainda */ }
}
async function saveCareer(){
  if(!state.career || !state.profile) return;
  const ok = await storageWrite(profileKey(STORAGE_KEY_CAREER), JSON.stringify(state.career));
  if(!ok) showToast('⚠️ Não foi possível salvar seu progresso neste navegador.');
}
async function saveLeagues(){
  if(!state.profile) return;
  const ok = await storageWrite(profileKey(STORAGE_KEY_LEAGUES), JSON.stringify(state.customLeagues));
  if(!ok) showToast('⚠️ Não foi possível salvar suas ligas neste navegador.');
}

function el(html){ const d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
function rand(arr){ return arr[Math.floor(Math.random()*arr.length)]; }
function randInt(a,b){ return Math.floor(Math.random()*(b-a+1))+a; }
function clamp(v,a,b){ return Math.max(a,Math.min(b,v)); }
function fmtMoney(v){ return 'R$ ' + v.toLocaleString('pt-BR'); }
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = el('<div id="toast" class="toast"></div>'); document.body.appendChild(t); }
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(state.toastTimeout);
  state.toastTimeout = setTimeout(()=>t.classList.remove('show'), 2600);
}

/* ================= LOGIN / CADASTRO (CONTA NA NUVEM) ================= */
function screenCloudAuth(){
  const box = el('<div></div>');
  box.appendChild(el(`<div class="section-title"><h2>Entrar com Conta</h2><div class="line"></div></div>`));

  if(!cloudReady){
    box.appendChild(el(`<div class="notice">O login com conta ainda não foi configurado neste jogo — falta preencher o FIREBASE_CONFIG no código-fonte (veja o comentário com as instruções logo no início do &lt;script&gt;).</div>`));
    const backBtn = el(`<button class="btn secondary">‹ Voltar</button>`);
    backBtn.onclick = ()=>{ state.screen='entryChoice'; render(); };
    box.appendChild(backBtn);
    return box;
  }

  const tabRow = el(`<div class="choice-row" style="margin-bottom:16px;"></div>`);
  let mode = screenCloudAuth._mode || 'login';
  const loginTab = el(`<div class="choice-pill ${mode==='login'?'active':''}" style="padding:12px 18px;">Entrar</div>`);
  const signupTab = el(`<div class="choice-pill ${mode==='signup'?'active':''}" style="padding:12px 18px;">Criar Conta</div>`);
  loginTab.onclick = ()=>{ screenCloudAuth._mode='login'; render(); };
  signupTab.onclick = ()=>{ screenCloudAuth._mode='signup'; render(); };
  tabRow.appendChild(loginTab); tabRow.appendChild(signupTab);
  box.appendChild(tabRow);

  const form = el('<div></div>');
  function field(labelText, node){ const f=el(`<div class="field"><label>${labelText}</label></div>`); f.appendChild(node); return f; }

  const displayNameInput = el(`<input type="text" placeholder="Como quer ser chamado no jogo">`);
  const emailInput = el(`<input type="text" placeholder="voce@email.com">`);
  const passInput = el(`<input type="password" placeholder="Mínimo 6 caracteres">`);

  if(mode==='signup'){ form.appendChild(field('Nome de exibição', displayNameInput)); }
  form.appendChild(field('E-mail', emailInput));
  form.appendChild(field('Senha', passInput));
  box.appendChild(form);

  const statusMsg = el(`<p class="hint" style="min-height:16px;"></p>`);

  const actionBtn = el(`<button class="btn full">${mode==='login'?'🔐 Entrar':'✅ Criar Conta e Começar'}</button>`);
  actionBtn.onclick = async ()=>{
    const email = emailInput.value.trim();
    const pass = passInput.value;
    if(!email || !pass){ statusMsg.textContent = 'Preencha e-mail e senha.'; return; }
    actionBtn.disabled = true;
    try{
      if(mode==='signup'){
        const cred = await cloudAuth.createUserWithEmailAndPassword(email, pass);
        const dn = displayNameInput.value.trim();
        if(dn) await cred.user.updateProfile({displayName: dn});
        await finishCloudLogin(cred.user, dn);
      } else {
        const cred = await cloudAuth.signInWithEmailAndPassword(email, pass);
        await finishCloudLogin(cred.user);
      }
    }catch(e){
      statusMsg.textContent = traduzErroFirebase(e);
    }
    actionBtn.disabled = false;
  };
  box.appendChild(actionBtn);
  box.appendChild(statusMsg);

  if(mode==='login'){
    const forgotBtn = el(`<button class="btn ghost full" style="margin-top:8px;">Esqueci minha senha</button>`);
    forgotBtn.onclick = async ()=>{
      const email = emailInput.value.trim();
      if(!email){ statusMsg.textContent = 'Digite seu e-mail acima primeiro.'; return; }
      try{
        await cloudAuth.sendPasswordResetEmail(email);
        statusMsg.textContent = 'E-mail de redefinição enviado — confira sua caixa de entrada.';
      }catch(e){ statusMsg.textContent = traduzErroFirebase(e); }
    };
    box.appendChild(forgotBtn);
  }

  const backBtn = el(`<button class="btn secondary full" style="margin-top:8px;">‹ Voltar</button>`);
  backBtn.onclick = ()=>{ state.screen='entryChoice'; render(); };
  box.appendChild(backBtn);
  return box;
}

async function finishCloudLogin(user, displayNameOverride){
  state.authMode = 'cloud';
  state.firebaseUser = user;
  state.profile = displayNameOverride || user.displayName || user.email;
  state.career = null; state.referee = null; state.refExists = false; state.customLeagues = [];
  await loadCareer();
  state.screen = 'menu';
  render();
}

function traduzErroFirebase(e){
  const code = e && e.code || '';
  const map = {
    'auth/email-already-in-use': 'Já existe uma conta com esse e-mail. Tente entrar em vez de criar.',
    'auth/invalid-email': 'E-mail inválido.',
    'auth/weak-password': 'Senha muito curta — use pelo menos 6 caracteres.',
    'auth/user-not-found': 'Não encontramos uma conta com esse e-mail.',
    'auth/wrong-password': 'Senha incorreta.',
    'auth/invalid-credential': 'E-mail ou senha incorretos.',
    'auth/too-many-requests': 'Muitas tentativas — aguarde um pouco e tente de novo.',
    'auth/network-request-failed': 'Falha de conexão com o servidor de login.',
  };
  return map[code] || ('Erro: ' + (e && e.message ? e.message : 'algo deu errado.'));
}

        <h3>${c.title}</h3>
        <p>${c.desc}</p>
      </div>
    `);
    if(!c.disabled) card.onclick = c.action;
    grid.appendChild(card);
  });
  box.appendChild(grid);
  return box;
}

/* ================= CRIADOR DE ÁRBITRO ================= */
function screenRefCreator(){
  const r = state.referee ? {...state.referee} : defaultReferee();
  const box = el('<div></div>');
  box.appendChild(el(`<div class="section-title"><h2>Criador de Árbitro</h2><div class="line"></div></div>`));

  const previewWrap = el(`
    <div class="avatar-wrap">
      <div class="avatar-preview" id="avPrev" style="background:${r.skin}; border-color:${r.kit};">${r.face}</div>
      <small class="hint">Pré-visualização estilizada (emoji + cores)</small>
    </div>
  `);
  box.appendChild(previewWrap);

  const form = el('<div class="form-grid"></div>');
  function field(labelText, inputHtml){
    const f = el(`<div class="field"><label>${labelText}</label></div>`);
    f.appendChild(inputHtml);
    return f;
  }

  const firstName = el(`<input type="text" value="${r.firstName}">`);
  const lastName = el(`<input type="text" value="${r.lastName}">`);
  const nationality = el(`<input type="text" value="${r.nationality}">`);
  const age = el(`<input type="number" min="22" max="60" value="${r.age}">`);
  const height = el(`<input type="number" min="160" max="205" value="${r.height}">`);
  const weight = el(`<input type="number" min="55" max="110" value="${r.weight}">`);

  form.appendChild(field('Nome', firstName));
  form.appendChild(field('Sobrenome', lastName));
  form.appendChild(field('Nacionalidade', nationality));
  form.appendChild(field('Idade', age));
  form.appendChild(field('Altura (cm)', height));
  form.appendChild(field('Peso (kg)', weight));
  box.appendChild(form);

  let picked = {skin:r.skin, kit:r.kit, eye:r.eye, face:r.face, hair:r.hair, beard:r.beard, voice:r.voice, whistleStyle:r.whistleStyle, runStyle:r.runStyle, personality:r.personality};

  function swatchRow(labelText, options, current, applyKey){
    const wrap = el(`<div class="field"><label>${labelText}</label><div class="swatches"></div></div>`);
    const row = wrap.querySelector('.swatches');
    options.forEach(color=>{
      const s = el(`<div class="swatch" style="background:${color};"></div>`);
      if(color===current) s.classList.add('active');
      s.onclick = ()=>{
        row.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active'));
        s.classList.add('active');
        picked[applyKey]=color;
        if(applyKey==='skin') previewWrap.querySelector('#avPrev').style.background = color;
        if(applyKey==='kit') previewWrap.querySelector('#avPrev').style.borderColor = color;
      };
      row.appendChild(s);
    });
    return wrap;
  }
  box.appendChild(swatchRow('Tom de pele', SKIN_TONES, r.skin, 'skin'));
  box.appendChild(swatchRow('Cor do uniforme favorito', KIT_COLORS, r.kit, 'kit'));
  box.appendChild(swatchRow('Cor dos olhos', EYE_COLORS, r.eye, 'eye'));

  const faceWrap = el(`<div class="field"><label>Rosto</label><div class="choice-row"></div></div>`);
  FACES.forEach(f=>{
    const pill = el(`<div class="choice-pill" style="font-size:18px;">${f}</div>`);
    if(f===r.face) pill.classList.add('active');
    pill.onclick = ()=>{ faceWrap.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); picked.face=f; previewWrap.querySelector('#avPrev').textContent=f; };
    faceWrap.querySelector('.choice-row').appendChild(pill);
  });
  box.appendChild(faceWrap);

  function pillRow(labelText, options, current, key){
    const wrap = el(`<div class="field"><label>${labelText}</label><div class="choice-row"></div></div>`);
    options.forEach(opt=>{
      const pill = el(`<div class="choice-pill">${opt}</div>`);
      if(opt===current) pill.classList.add('active');
      pill.onclick=()=>{ wrap.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); picked[key]=opt; };
      wrap.querySelector('.choice-row').appendChild(pill);
    });
    return wrap;
  }

  box.appendChild(pillRow('Cabelo', ['Curto','Longo','Careca','Cacheado','Rabo de cavalo'], r.hair, 'hair'));
  box.appendChild(pillRow('Barba', ['Sem barba','Cavanhaque','Barba cheia','Bigode'], r.beard, 'beard'));
  box.appendChild(pillRow('Voz', ['Firme','Grave','Aguda','Serena'], r.voice, 'voice'));
  box.appendChild(pillRow('Estilo de apitar', ['Curto e seco','Longo e forte','Duplo apito','Discreto'], r.whistleStyle, 'whistleStyle'));
  box.appendChild(pillRow('Estilo de corrida', ['Ágil','Ereto e firme','Econômico','Explosivo'], r.runStyle, 'runStyle'));

  box.appendChild(el(`<div class="section-title"><h3>Personalidade</h3><div class="line"></div></div>`));
  const persWrap = el('<div class="choice-row"></div>');
  const persDesc = el(`<p class="hint" style="margin-top:8px;">${PERSONALITIES.find(p=>p.key===r.personality).desc}</p>`);
  PERSONALITIES.forEach(p=>{
    const pill = el(`<div class="choice-pill" style="padding:12px 16px;">${p.label}</div>`);
    if(p.key===r.personality) pill.classList.add('active');
    pill.onclick=()=>{ persWrap.querySelectorAll('.choice-pill').forEach(x=>x.classList.remove('active')); pill.classList.add('active'); picked.personality=p.key; persDesc.textContent = p.desc; };
    persWrap.appendChild(pill);
  });
  box.appendChild(persWrap);
  box.appendChild(persDesc);

  const saveBtn = el(`<button class="btn full" style="margin-top:20px;">💾 Salvar Árbitro e Continuar</button>`);
  saveBtn.onclick = async ()=>{
    const newRef = {
      firstName: firstName.value.trim() || 'Árbitro',
      lastName: lastName.value.trim() || '',
      nationality: nationality.value.trim() || 'Brasil',
      age: clamp(parseInt(age.value)||30, 22, 60),
      height: clamp(parseInt(height.value)||180, 160, 205),
      weight: clamp(parseInt(weight.value)||78, 55, 110),
      skin: picked.skin, face: picked.face, hair: picked.hair, beard: picked.beard, eye: picked.eye,
      kit: picked.kit, personality: picked.personality, voice: picked.voice,
      whistleStyle: picked.whistleStyle, runStyle: picked.runStyle,
    };
    state.referee = newRef;
    if(!state.career){ state.career = defaultCareer(newRef); }
    else { state.career.referee = newRef; }
    state.refExists = true;
    await saveCareer();
    showToast('Árbitro salvo com sucesso!');
    state.screen='careerHub';
    render();
  };
  box.appendChild(saveBtn);
  return box;
}

  form.appendChild(field('Troféu', trophy));

  box.appendChild(el(`<div class="section-title"><h3>Clubes da Liga</h3><div class="line"></div></div>`));
  let clubList = (editing && editing.clubList && editing.clubList.length)
    ? editing.clubList.map(c=>({name:c.name, color:c.color}))

  const clubsWrap = el(`<div class="field"><label>Clubes cadastrados (<span id="clubCount">${clubList.length}</span> — mínimo 4, máximo 32)</label><div id="clubListContainer"></div></div>`);

  function renderClubList(){
    const container = clubsWrap.querySelector('#clubListContainer');
    container.innerHTML='';
    clubList.forEach((c,i)=>{
      const row = el(`
        <div style="display:flex; gap:8px; align-items:center; margin-bottom:8px;">
          <div class="swatch club-color-swatch" style="background:${c.color}; width:26px; height:26px; flex-shrink:0;" title="Clique para trocar a cor"></div>
          <input type="text" value="${c.name}" style="flex:1;">
          <button class="btn danger" style="padding:7px 11px;" title="Remover clube">🗑</button>
        </div>
      `);
      const swatchEl = row.querySelector('.club-color-swatch');
      const nameInput = row.querySelector('input');
      const delBtn = row.querySelector('button');
      nameInput.oninput = ()=>{ clubList[i].name = nameInput.value; };
      swatchEl.onclick = ()=>{
        const idx = KIT_COLORS.indexOf(clubList[i].color);
        clubList[i].color = KIT_COLORS[(idx+1)%KIT_COLORS.length];
        swatchEl.style.background = clubList[i].color;
      };
      delBtn.onclick = ()=>{
        if(clubList.length<=4){ showToast('A liga precisa de pelo menos 4 clubes.'); return; }
        clubList.splice(i,1);
        renderClubList();
      };
      container.appendChild(row);
    });

  renderClubList();

  const addClubRow = el('<div class="btn-row" style="margin-top:4px;"></div>');

  const addClubBtn = el(`<button class="btn secondary">+ Adicionar Clube</button>`);
  addClubBtn.onclick = ()=>{
    if(clubList.length>=32){ showToast('Máximo de 32 clubes por liga.'); return; }
    const nm = addClubNameInput.value.trim() || rand(CLUBS);
    clubList.push({name:nm, color:rand(KIT_COLORS)});
    addClubNameInput.value='';
    renderClubList();
  };
  addClubRow.appendChild(addClubNameInput); addClubRow.appendChild(addClubBtn);
  clubsWrap.appendChild(addClubRow);

  const crestWrap = el(`<div class="field"><label>Escudo</label><div class="choice-row"></div></div>`);
  let crest = l.crest;
  ['🛡️','⚽','🦁','🐂','⭐','🔱','🦅','🐎'].forEach(ic=>{
    const pill = el(`<div class="choice-pill" style="font-size:18px;">${ic}</div>`);

    pill.onclick=()=>{ crestWrap.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); crest=ic; };
    crestWrap.querySelector('.choice-row').appendChild(pill);
  });
  box.appendChild(crestWrap);

  box.appendChild(el(`<div class="field"><label>Cores oficiais</label></div>`));
  const colorsRow = el('<div class="swatches"></div>');
  let colorA=l.colorA, colorB=l.colorB;
  [['A',['#3ea86e','#d7263d','#3a6fd8','#f5c518'],c=>colorA=c],['B',['#f5c518','#181818','#e8e8e8','#8a7326'],c=>colorB=c]].forEach(([tag,opts,setter])=>{
    opts.forEach(c=>{
      const s = el(`<div class="swatch" style="background:${c};" title="Cor ${tag}"></div>`);
      s.onclick=()=>{ setter(c); };
      colorsRow.appendChild(s);
    });
  });
  box.appendChild(colorsRow);

  const typeWrap = el(`<div class="field"><label>Tipo de competição</label><div class="choice-row"></div></div>`);
  let compType = l.type;
  ['Pontos corridos','Mata-mata','Grupos + mata-mata','Copa relâmpago'].forEach(t=>{
    const pill = el(`<div class="choice-pill">${t}</div>`);
    if(t===l.type) pill.classList.add('active');
    pill.onclick=()=>{ typeWrap.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); compType=t; };
    typeWrap.querySelector('.choice-row').appendChild(pill);
  });
  box.appendChild(typeWrap);

  const ptsWrap = el(`<div class="field"><label>Sistema de pontos</label><div class="choice-row"></div></div>`);
  let ptsSys = l.pointsSystem;
  ['3-1-0 (vitória-empate-derrota)','2-1-0 (clássico)','Somente eliminação'].forEach(t=>{
    const pill = el(`<div class="choice-pill">${t}</div>`);
    if(t===l.pointsSystem) pill.classList.add('active');
    pill.onclick=()=>{ ptsWrap.querySelectorAll('.choice-pill').forEach(p=>p.classList.remove('active')); pill.classList.add('active'); ptsSys=t; };
    ptsWrap.querySelector('.choice-row').appendChild(pill);
  });
  box.appendChild(ptsWrap);

  const kitWrap = el(`<div class="field"><label>Uniforme oficial dos árbitros</label><div class="swatches"></div></div>`);
  let refKit = l.refKit;
  KIT_COLORS.forEach(c=>{
    const s = el(`<div class="swatch" style="background:${c};"></div>`);
    if(c===l.refKit) s.classList.add('active');
    s.onclick=()=>{ kitWrap.querySelectorAll('.swatch').forEach(x=>x.classList.remove('active')); s.classList.add('active'); refKit=c; };
    kitWrap.querySelector('.swatches').appendChild(s);
  });
  box.appendChild(kitWrap);

  box.appendChild(el(`<div class="field"><label>Regras especiais</label></div>`));
  const special = el(`<textarea placeholder="Ex.: cada equipe pode pedir 1 revisão manual por jogo...">${l.specialRules}</textarea>`);
  box.appendChild(special);

  const btnRow = el('<div class="btn-row" style="margin-top:20px;"></div>');
  const saveBtn = el(`<button class="btn">💾 Salvar Liga</button>`);
  saveBtn.onclick = async ()=>{
    if(clubList.length<4){ showToast('Adicione pelo menos 4 clubes antes de salvar.'); return; }
    const finalClubs = clubList.map(c=>({name:(c.name||'').trim()||rand(CLUBS), color:c.color}));
    const newLeague = {
      id: editing? editing.id : 'league_'+Date.now(),
      name:name.value.trim()||'Liga Sem Nome', country:country.value.trim()||'Brasil',
      crest, colorA, colorB, clubs:finalClubs.length, clubList:finalClubs,
      rounds:clamp(parseInt(rounds.value)||11,1,38), type:compType, pointsSystem:ptsSys,
      specialRules: special.value.trim(), refKit, ball: ball.value.trim()||'Bola Oficial',
      sponsors: sponsors.value.trim(), trophy: trophy.value.trim()||'Troféu da Liga',
      anthem: anthem.value.trim(), progress:editing?editing.progress:0,
    };
    if(editing){
      const idx = state.customLeagues.findIndex(x=>x.id===editing.id);
      state.customLeagues[idx]=newLeague;
    } else {
      state.customLeagues.push(newLeague);
    }
    await saveLeagues();
    showToast('Liga salva!');
    state.editingLeague=null;
    state.screen='leagueList';
    render();
  };
  const cancelBtn = el(`<button class="btn secondary">Cancelar</button>`);
  cancelBtn.onclick=()=>{ state.editingLeague=null; state.screen='leagueList'; render(); };
  btnRow.appendChild(saveBtn); btnRow.appendChild(cancelBtn);
  box.appendChild(btnRow);

  box.appendChild(el(`<p class="hint" style="margin-top:14px;">💡 Importação de ligas da comunidade: cole um código de liga compartilhado (JSON) para importar.</p>`));
  const importRow = el(`<div class="btn-row"><input type="text" id="importCode" placeholder="Cole o código JSON da liga aqui" style="flex:1;"><button class="btn secondary">Importar</button></div>`);
  importRow.querySelector('button').onclick = async ()=>{
    try{
      const val = importRow.querySelector('#importCode').value;
      const parsed = JSON.parse(val);
      parsed.id = 'league_'+Date.now();
      state.customLeagues.push(parsed);
      await saveLeagues();
      showToast('Liga importada com sucesso!');
      state.screen='leagueList'; render();
    }catch(e){ showToast('Código inválido — verifique o JSON.'); }
  };
  box.appendChild(importRow);
  return box;
}

  if(state.customLeagues.length===0){
    box.appendChild(el(`<div class="notice">Nenhuma liga criada ainda. Use o Criador de Liga no menu.</div>`));
    return box;
  }
  const grid = el('<div class="menu-grid"></div>');
  state.customLeagues.forEach(l=>{
    const card = el(`
      <div class="menu-card">
        <span class="tag">${l.progress||0}/${l.rounds} rodadas</span>
        <span class="icon">${l.crest}</span>
        <h3>${l.name}</h3>
        <p>${l.country} · ${l.clubs} clubes · ${l.type}</p>
      </div>
    `);
    const btns = el('<div class="btn-row" style="margin-top:10px;"></div>');
    const play = el(`<button class="btn" style="flex:1;">▶ Jogar rodada</button>`);
    play.onclick=(e)=>{ e.stopPropagation(); startLeagueMatch(l); };
    const editB = el(`<button class="btn secondary">✏️</button>`);
    editB.onclick=(e)=>{ e.stopPropagation(); state.editingLeague=l; state.screen='leagueCreator'; render(); };

    btns.appendChild(play); btns.appendChild(editB); btns.appendChild(delB);
    card.appendChild(btns);
    grid.appendChild(card);
  });
  box.appendChild(grid);
  return box;
}

  segundoAmarelo:{icon:'🟨🟨', label:'Reincidência Disciplinar', color:'var(--red)'},
  reposicao: {icon:'🔄', label:'Reposição de Bola',      color:'var(--cream-dim)'},
  vantagem:  {icon:'➡️', label:'Sequência de Jogo',      color:'var(--green-ok)'},
  daoccg:    {icon:'⛔', label:'Chance Clara de Gol',     color:'var(--red)'},
  cotovelada:{icon:'💥', label:'Contato Violento sem Bola', color:'var(--red)'},
  escanteio: {icon:'🚩', label:'Lance de Escanteio',     color:'var(--gold)'},
  recuo:     {icon:'🧤', label:'Bola para o Goleiro',    color:'var(--yellow)'},
  encroach:  {icon:'📏', label:'Barreira Adiantada',     color:'var(--gold-dim)'},
  celebra:   {icon:'🎉', label:'Comemoração Excessiva',  color:'var(--gold-dim)'},
};

function pickSide(){ return Math.random()<0.5 ? {side:'home',opp:'away'} : {side:'away',opp:'home'}; }
function jersey(){ return randInt(2,29); }

function sideInfo(ctx, side){
  return side==='home'
    ? {name:ctx.homeTeam, color:ctx.homeColor}
    : {name:ctx.awayTeam, color:ctx.awayColor};
}

function buildEventBank(ctx){
  const bank = [];

  // 1) Disputa de bola (3 variantes de intensidade, cada uma com frases alternativas)
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const n1=jersey(), n2=jersey();
    const sev = rand(['leve','normal','forte']);
    const p1=rand(PLAYER_NAMES), p2=rand(PLAYER_NAMES);
    const zone = zonePick('meioEsq','meioDir','meioCen');
    let correctIdx, text;
    if(sev==='leve'){
      text = pick(
        `${p1} (nº${n1}, ${t1.name}) e ${p2} (nº${n2}, ${t2.name}) travam uma disputa de corpo limpa pela bola, sem exagero de nenhum dos dois.`,
        `Bola dividida entre ${p1} (nº${n1}, ${t1.name}) e ${p2} (nº${n2}, ${t2.name}) — contato mínimo, dentro do esperado para o lance.`,
        `${p1} (nº${n1}, ${t1.name}) chega no mesmo tempo que ${p2} (nº${n2}, ${t2.name}), os dois se esbarram levemente ao tentar a bola.`
      );
      correctIdx = 0;
    } else if(sev==='normal'){
      text = pick(
        `${p1} (nº${n1}, ${t1.name}) chega um instante atrasado e acerta a canela de ${p2} (nº${n2}, ${t2.name}) antes da bola.`,
        `${p1} (nº${n1}, ${t1.name}) desarma com o pé na frente, mas pega ${p2} (nº${n2}, ${t2.name}) primeiro que a bola.`,
        `Disputa de bola dividida: ${p1} (nº${n1}, ${t1.name}) trava a perna de ${p2} (nº${n2}, ${t2.name}) num carrinho impreciso.`
      );
      correctIdx = 1;
    } else {
      text = pick(
        `${p1} (nº${n1}, ${t1.name}) entra com os dois pés à frente, atrasado, sem chance de tocar na bola, e acerta ${p2} (nº${n2}, ${t2.name}) com força.`,
        `Entrada perigosa: ${p1} (nº${n1}, ${t1.name}) salta com a sola virada para cima e atinge a perna de apoio de ${p2} (nº${n2}, ${t2.name}).`
      );
      correctIdx = 3;
    }
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.disputa,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Nenhuma infração', correct: correctIdx===0},
        {label:'Marcar falta', correct: correctIdx===1},
        {label:'Dar vantagem', correct: sev==='normal'},
        {label:'Falta + Cartão Amarelo', correct: correctIdx===3, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  // 2) Mão na bola
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const inBox = Math.random()<0.5;
    const deliberate = Math.random()<0.5;
    const zone = inBox? zonePick('atqArea') : zonePick('atqEsq','atqDir');
    const text = pick(
      `A bola bate ${deliberate? 'no braço nitidamente afastado do corpo de':'de forma acidental, colado ao corpo, em'} ${p1} (nº${n1}, ${t1.name}), ${inBox? 'dentro da grande área':'na entrada da área'}.`,
      `${p1} (nº${n1}, ${t1.name}) tenta bloquear o chute e a bola encosta ${deliberate? 'na mão claramente aberta, buscando espaço':'no braço colado ao tronco'}, ${inBox? 'dentro da área':'fora da área'}.`,
      `Cruzamento na área desvia ${deliberate? 'na mão aberta e visível de':'de raspão no ombro/braço colado de'} ${p1} (nº${n1}, ${t1.name}).`
    );
    let correctLabel;
    if(!deliberate) correctLabel='Nenhuma infração';
    else correctLabel = inBox? 'Pênalti' : 'Falta';
    return {
      category:['precisao','aplicacaoRegras'], zone, text, type:EVENT_TYPES.maoNaBola,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Nenhuma infração', correct: correctLabel==='Nenhuma infração'},
        {label:'Falta', correct: correctLabel==='Falta'},
        {label:'Pênalti', correct: correctLabel==='Pênalti'},
      ],
      varEligible: inBox,
    };
  });

  // 3) Entrada dura (nível de cartão)
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const n1=jersey(), n2=jersey();
    const p1=rand(PLAYER_NAMES), p2=rand(PLAYER_NAMES);
    const level = rand(['imprudente','temeraria','excessiva']);
    const zone = zonePick('meioEsq','meioDir','meioCen','defEsq','defDir');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) chega de sola na altura da canela de ${p2} (nº${n2}, ${t2.name}), ${level==='excessiva'?'usando força totalmente desproporcional, sem disputar a bola':'em disputa de bola, mas visivelmente fora de tempo'}.`,
      `Carrinho de ${p1} (nº${n1}, ${t1.name}) chega alto e pega em cheio o tornozelo de ${p2} (nº${n2}, ${t2.name}).`,
      `${p1} (nº${n1}, ${t1.name}) trava por trás em ${p2} (nº${n2}, ${t2.name}), que não vê o lance chegando.`
    );
    let correctLabel = level==='imprudente' ? 'Falta + Cartão Amarelo' : (level==='temeraria' ? 'Falta + Cartão Amarelo' : 'Falta + Cartão Vermelho');
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.entrada,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Apenas falta', correct:false},
        {label:'Falta + Cartão Amarelo', correct: correctLabel==='Falta + Cartão Amarelo', card:'yellow'},
        {label:'Falta + Cartão Vermelho', correct: correctLabel==='Falta + Cartão Vermelho', card:'red'},
      ],
      varEligible:true,
    };
  });

  // 4) Simulação x pênalti legítimo
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const isDive = Math.random()<0.55;
    const zone = zonePick('atqArea');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) cai na área ${isDive? 'com o mínimo contato, procurando claramente o pênalti':'após puxão discreto na camisa, quase imperceptível'}.`,
      `${p1} (nº${n1}, ${t1.name}) se joga no chão dentro da área ${isDive? 'antes mesmo de qualquer contato real':'após leve empurrão nas costas'}.`
    );
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.simulacao,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Ignorar e mandar seguir', correct:false},
        {label:'Pênalti', correct: !isDive},
        {label:'Cartão Amarelo por simulação', correct: isDive, card:'yellow'},
      ],
      varEligible:true,
    };
  });

  // 5) Impedimento
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const isOffside = Math.random()<0.5;
    const zone = zonePick('atqEsq','atqDir','atqArea');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) recebe lançamento em profundidade e sai livre na cara do gol. A defesa reclama de impedimento.`,
      `Passe entre linhas encontra ${p1} (nº${n1}, ${t1.name}) na corrida — a bandeira do assistente balança em dúvida.`
    );
    return {
      category:['precisao','aplicacaoRegras'], zone, text, type:EVENT_TYPES.impedimento,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Validar jogada (sem impedimento)', correct: !isOffside},
        {label:'Marcar impedimento', correct: isOffside},
      ],
      varEligible:true,
    };
  });

  // 6) Gol com possível irregularidade
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const hadFoulBefore = Math.random()<0.4;
    const zone = zonePick('atqArea');
    const text = pick(
      `Golaço de ${p1} (nº${n1}, ${t1.name})! A torcida explode... mas houve um contato duvidoso pouco antes da finalização.`,
      `${p1} (nº${n1}, ${t1.name}) só empurra para o gol vazio após bela jogada coletiva — só que a origem do lance ficou confusa.`
    );
    return {
      category:['precisao','usoVar'], zone, text, type:EVENT_TYPES.gol,
      side, team:t1.name, teamColor:t1.color, jersey:n1, isGoal:true,
      options:[
        {label:'Validar o gol', correct: !hadFoulBefore},
        {label:'Anular o gol (falta anterior)', correct: hadFoulBefore},
      ],
      varEligible:true,
    };
  });

  // 7) Falta tática
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const zone = zonePick('defEsq','defDir','meioCen');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) puxa a camisa de um adversário do ${t2.name} para impedir um contra-ataque promissor, claramente tático.`,
      `Contra-ataque nascendo: ${p1} (nº${n1}, ${t1.name}) trava o jogador do ${t2.name} agarrando o braço, sem nenhuma intenção de jogar a bola.`
    );
    return {
      category:['controleDisciplinar','aplicacaoRegras'], zone, text, type:EVENT_TYPES.taticaCartao,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Apenas falta', correct:false},
        {label:'Falta + Cartão Amarelo (tática)', correct:true, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  // 8) Perda de tempo
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const zone = zonePick('latDir','latEsq');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}), do time que está na frente do placar, demora demais para repor a bola no lateral, claramente enrolando.`,
      `${p1} (nº${n1}, ${t1.name}) finge dores e se joga no gramado sem necessidade, atrasando a reposição de bola.`
    );
    return {
      category:['controleDisciplinar','autoridade'], zone, text, type:EVENT_TYPES.tempo,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Ignorar', correct:false},
        {label:'Advertir verbalmente', correct:true},
        {label:'Cartão Amarelo por perda de tempo', correct:true, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  // 9) Reclamação de jogador
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const aggressive = Math.random()<0.5;
    const zone = zonePick('latDir','latEsq','meioCen');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) vem reclamar da sua última decisão, ${aggressive? 'gesticulando muito e no tom mais agressivo possível':'de forma educada, só pedindo uma explicação'}.`,
      `${p1} (nº${n1}, ${t1.name}) corre em sua direção ${aggressive? 'aos gritos, contestando a marcação':'com a mão levantada, pedindo para conversar'}.`
    );
    return {
      category:['comunicacao','autoridade'], zone, text, type:EVENT_TYPES.reclamacao,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Explicar com calma', correct: !aggressive},
        {label:'Ignorar e seguir o jogo', correct:false},
        {label:'Cartão Amarelo por dissidência', correct: aggressive, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  // 10) Reclamação do técnico
  bank.push(()=>{
    const {side} = pickSide();
    const t1=sideInfo(ctx,side);
    const t = rand(COACH_NAMES);
    const invades = Math.random()<0.4;
    const zone = ZONES.banco;
    const text = pick(
      `${t} (comissão técnica do ${t1.name}) grita da beira do campo ${invades? 'e chega a pisar dentro do gramado protestando':'contra sua marcação, bem alterado'}.`,
      `${t} (${t1.name}) reclama aos berros do quarto oficial sobre sua última decisão, gesticulando muito.`
    );
    return {
      category:['autoridade','comunicacao'], zone, text, type:EVENT_TYPES.tecnico,
      side, team:t1.name, teamColor:t1.color, jersey:null,
      options:[
        {label:'Advertência verbal', correct: !invades},
        {label:'Cartão Amarelo para o técnico', correct: invades, card:'yellow'},
        {label:'Expulsar o técnico', correct:false},
      ],
      varEligible:false,
    };
  });

  // 11) Jogadores cercam o árbitro
  bank.push(()=>{
    const zone = ZONES.meioCen;
    const text = pick(
      `Após a marcação, vários jogadores dos dois times cercam você reclamando ao mesmo tempo, em tom exaltado.`,
      `Tumulto generalizado: jogadores de ambos os lados se aproximam gesticulando, cada um puxando para o seu lado.`
    );
    return {
      category:['autoridade','comunicacao'], zone, text, type:EVENT_TYPES.cercado,
      side:null, team:null, teamColor:null, jersey:null,
      options:[
        {label:'Impor autoridade e afastar todos com firmeza', correct:true},
        {label:'Conversar com o capitão apenas', correct:true},
        {label:'Ceder e reconsiderar a marcação', correct:false},
      ],
      varEligible:false,
    };
  });

  // 12) Segundo amarelo
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const zone = zonePick('defEsq','defDir','meioCen');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}), que já está advertido, comete nova infração clara — puxão evidente para travar o avanço adversário.`,
      `Já amarelado, ${p1} (nº${n1}, ${t1.name}) volta a cometer falta dura, sem qualquer disputa real pela bola.`
    );
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.segundoAmarelo,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Apenas falta', correct:false},
        {label:'Segundo Cartão Amarelo (expulsão)', correct:true, card:'red'},
      ],
      varEligible:true,
    };
  });

  // 13) Reposição de bola
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const outType = rand(['lateral','escanteio','tiro de meta']);
    const zone = outType==='lateral'? zonePick('latDir','latEsq') : (outType==='escanteio'? zonePick('escEsq','escDir') : zonePick('atqArea','defArea'));
    const quemDesviou = Math.random()<0.5? t1.name : t2.name;
    const text = pick(
      `A bola sai${zone.label.includes('Lateral')?' pela lateral':(zone.label.includes('Escanteio')?' viva próximo à linha de fundo':'')} após desviar em jogador do ${quemDesviou}. Reposição a definir.`,
      `Bola bate no jogador do ${quemDesviou} e sai do campo perto da bandeirinha. Reposição precisa ser marcada.`
    );
    return {
      category:['aplicacaoRegras','posicionamento'], zone, text, type: outType==='escanteio'? EVENT_TYPES.escanteio : EVENT_TYPES.reposicao,
      side, team:t1.name, teamColor:t1.color, jersey:null,
      options:[
        {label:'Lateral', correct: outType==='lateral'},
        {label:'Escanteio', correct: outType==='escanteio'},
        {label:'Tiro de meta', correct: outType==='tiro de meta'},
      ],
      varEligible:false,
    };
  });

  // 14) Vantagem
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const zone = zonePick('atqEsq','atqDir');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) sofre falta mas a bola sobra limpa para um companheiro em boa posição de ataque.`,
      `Falta clara em ${p1} (nº${n1}, ${t1.name}), só que o time ganha vantagem real na jogada seguinte.`
    );
    return {
      category:['precisao','posicionamento'], zone, text, type:EVENT_TYPES.vantagem,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Parar o jogo e marcar falta', correct:false},
        {label:'Aplicar a Lei da Vantagem', correct:true},
      ],
      varEligible:false,
    };
  });

  // 15) Chance clara de gol negada (DOGSO)
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const n1=jersey(), n2=jersey();
    const p1=rand(PLAYER_NAMES), p2=rand(PLAYER_NAMES);
    const clearChance = Math.random()<0.6;
    const zone = zonePick('defArea','atqArea');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}) puxa ${p2} (nº${n2}, ${t2.name}) por trás quando ele estava sozinho, de frente para o gol, sem goleiro na frente.`,
      `Último defensor: ${p1} (nº${n1}, ${t1.name}) derruba ${p2} (nº${n2}, ${t2.name}) na corrida, que tinha só o goleiro pela frente.`
    );
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.daoccg,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Apenas falta', correct:false},
        {label:'Falta + Cartão Amarelo', correct: !clearChance, card:'yellow'},
        {label:'Falta + Cartão Vermelho (chance clara de gol)', correct: clearChance, card:'red'},
      ],
      varEligible:true,
    };
  });

  // 16) Contato violento fora da disputa (cotovelada / mão no rosto)
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side), t2=sideInfo(ctx,opp);
    const n1=jersey(), n2=jersey();
    const p1=rand(PLAYER_NAMES), p2=rand(PLAYER_NAMES);
    const violento = Math.random()<0.5;
    const zone = zonePick('meioCen','defArea','atqArea');
    const text = pick(
      `Bola já tinha saído de perto quando ${p1} (nº${n1}, ${t1.name}) acerta o cotovelo no rosto de ${p2} (nº${n2}, ${t2.name}) durante o salto.`,
      `${p1} (nº${n1}, ${t1.name}) empurra o rosto de ${p2} (nº${n2}, ${t2.name}) com a mão aberta, longe da disputa pela bola.`
    );
    return {
      category:['precisao','controleDisciplinar'], zone, text, type:EVENT_TYPES.cotovelada,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Nenhuma infração (disputa normal)', correct: !violento},
        {label:'Falta + Cartão Amarelo', correct:false},
        {label:'Falta + Cartão Vermelho (agressão)', correct: violento, card:'red'},
      ],
      varEligible:true,
    };
  });

  // 17) Bola para o goleiro (retrocesso com a mão)
  bank.push(()=>{
    const {side} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const comAPe = Math.random()<0.5;
    const zone = zonePick('defArea');
    const text = pick(
      `${p1} (nº${n1}, ${t1.name}), o goleiro, recebe passe de um companheiro ${comAPe? 'com o pé, na entrada da área':'e, sob pressão, toca com a mão numa bola jogada de propósito pelo colega'}.`,
      `Recuo do zagueiro chega ao goleiro ${p1} (nº${n1}, ${t1.name}) — a dúvida é se foi jogado deliberadamente com o pé ou não.`
    );
    return {
      category:['precisao','aplicacaoRegras'], zone, text, type:EVENT_TYPES.recuo,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Nenhuma infração', correct: comAPe},
        {label:'Tiro livre indireto por infração do goleiro', correct: !comAPe},
      ],
      varEligible:false,
    };
  });

  // 18) Barreira adiantada em falta
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const invadiu = Math.random()<0.5;
    const zone = zonePick('meioCen','atqEsq','atqDir');
    const text = pick(
      `Na cobrança de falta, a barreira do ${t1.name} ${invadiu? 'avança antes do apito, invadindo os 9,15m regulamentares':'se mantém exatamente na distância marcada'}.`,
      `Você já tinha marcado a distância da barreira do ${t1.name}, mas ${invadiu? 'os jogadores dão dois passos à frente assim que o cobrador recua':'eles respeitam a marca no gramado'}.`
    );
    return {
      category:['aplicacaoRegras','autoridade'], zone, text, type:EVENT_TYPES.encroach,
      side, team:t1.name, teamColor:t1.color, jersey:null,
      options:[
        {label:'Deixar cobrar normalmente', correct: !invadiu},
        {label:'Recuar a barreira e Cartão Amarelo', correct: invadiu, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  // 19) Comemoração excessiva após gol
  bank.push(()=>{
    const {side,opp} = pickSide();
    const t1=sideInfo(ctx,side);
    const n1=jersey();
    const p1=rand(PLAYER_NAMES);
    const provocou = Math.random()<0.4;
    const zone = zonePick('atqArea','latDir','latEsq');
    const text = pick(
      `Depois do gol, ${p1} (nº${n1}, ${t1.name}) ${provocou? 'corre até a torcida rival provocando e tirando a camisa':'comemora normalmente com os companheiros'}.`,
      `${p1} (nº${n1}, ${t1.name}) comemora ${provocou? 'de forma provocativa, encarando o banco adversário':'com a torcida, sem exageros'}.`
    );
    return {
      category:['controleDisciplinar','autoridade'], zone, text, type:EVENT_TYPES.celebra,
      side, team:t1.name, teamColor:t1.color, jersey:n1,
      options:[
        {label:'Deixar comemorar, sem punição', correct: !provocou},
        {label:'Cartão Amarelo por comemoração excessiva', correct: provocou, card:'yellow'},
      ],
      varEligible:false,
    };
  });

  return bank;
}

function generateMatchEvents(count, ctx){
  const bank = buildEventBank(ctx);
  const events = [];
  const usedRecently = [];
  for(let i=0;i<count;i++){
    let gen, tries=0;
    do{ gen = rand(bank); tries++; }while(usedRecently.includes(gen) && tries<6);
    usedRecently.push(gen);
    if(usedRecently.length>4) usedRecently.shift();
    const ev = gen();
    ev.minute = randInt(1,90);
    events.push(ev);
  }
  events.sort((a,b)=>a.minute-b.minute);
  return events;
}

function newMatchCtx(mode, opts){
  opts = opts||{};
  const division = opts.division || DIVISIONS[0];
  const varEnabled = opts.varEnabled!==undefined? opts.varEnabled : division.var;
  const teams = {home: rand(CLUBS), away: rand(CLUBS)};
  const homeTeam = opts.homeTeam||teams.home, awayTeam = opts.awayTeam||teams.away;
  const paletteA = ['#f5c518','#3ea86e','#e8e8e8'];
  const paletteB = ['#3a6fd8','#d7263d','#181818'];
  const homeColor = opts.homeColor || rand(paletteA);
  const awayColor = opts.awayColor || rand(paletteB);
  const numEvents = opts.numEvents || randInt(8,11);
  const durationSec = opts.durationSec || randInt(160,220);
  const ctxSeed = {homeTeam, awayTeam};
  return {
    mode, division, varEnabled,
    homeTeam, awayTeam, homeColor, awayColor,
    durationSec, elapsed:0, active:true,
    events: generateMatchEvents(numEvents, ctxSeed),
    eventIndex:0,
    ballPos:{x:50,y:50},
    score:{home:0, away:0},
    scores:{precisao:[], posicionamento:[], controleDisciplinar:[], usoVar:[], comunicacao:[], autoridade:[], aplicacaoRegras:[]},
    stats:{yellow:0, red:0, penalties:0, goalsAnnulled:0, varReviews:0, seriousErrors:0},
    teamCards:{home:{yellow:0,red:0}, away:{yellow:0,red:0}},
    log:[],
    trainingMode: mode==='training',
    challenge: opts.challenge||null,
    league: opts.league||null,
  };
}

function startQuickMatch(){
